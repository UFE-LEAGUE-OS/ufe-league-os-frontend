name: Frontend CI/CD

on:
  pull_request:
    paths:
      - 'LEAGUE_OS_FRONTEND/**'
      - '.github/workflows/frontend-ci-cd.yml'
  push:
    branches:
      - main
    paths:
      - 'LEAGUE_OS_FRONTEND/**'
      - '.github/workflows/frontend-ci-cd.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LEAGUE_OS_FRONTEND

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LEAGUE_OS_FRONTEND/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LEAGUE_OS_FRONTEND/package-lock.json

      - name: Install dependencies
        working-directory: LEAGUE_OS_FRONTEND
        run: npm ci

      - name: Build
        working-directory: LEAGUE_OS_FRONTEND
        env:
          VITE_BASE_PATH: /ufe-league-os-frontend/
        run: npm run build

      - name: SPA fallback
        run: cp LEAGUE_OS_FRONTEND/dist/index.html LEAGUE_OS_FRONTEND/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: LEAGUE_OS_FRONTEND/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
