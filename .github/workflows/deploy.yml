name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      task:
        description: "Choose status to check the server. Choose deploy to run the deployment script."
        required: true
        default: "status"
        type: choice
        options:
          - status
          - deploy

concurrency:
  group: league-os-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: DigitalOcean Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh

          printf '%s' "${{ secrets.DROPLET_SSH_KEY_B64 }}" \
            | base64 -d \
            > ~/.ssh/league_os_deploy_key

          chmod 600 ~/.ssh/league_os_deploy_key

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          host="${{ secrets.DROPLET_HOST }}"
          keyscan_output="$(mktemp)"

          cleanup() {
            rm -f "$keyscan_output"
          }

          trap cleanup EXIT

          for attempt in $(seq 1 6); do
            echo "Scanning SSH host key... ($attempt/6)"

            if timeout 15s ssh-keyscan \
              -T 10 \
              -H "$host" \
              > "$keyscan_output" 2>/dev/null \
              && [ -s "$keyscan_output" ]; then

              cat "$keyscan_output" >> ~/.ssh/known_hosts
              echo "SSH host key recorded."
              exit 0
            fi

            echo "Host-key scan failed. Retrying..."
            sleep $((attempt * 5))
          done

          echo "Unable to retrieve the Droplet SSH host key after 6 attempts."
          exit 1

      - name: Run remote command
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.task }}" = "deploy" ]; then
            echo "Running deployment script on DigitalOcean..."
            REMOTE_COMMAND='cd /opt/league-os && ./deploy.sh'
          else
            echo "Checking DigitalOcean deployment status..."
            REMOTE_COMMAND='cd /opt/league-os && docker compose -f docker-compose.prod.yml ps && curl -fsS http://localhost/api/health/'
          fi

          ssh -i ~/.ssh/league_os_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "$REMOTE_COMMAND"

      - name: Public health check
        shell: bash
        run: |
          curl -fsS "http://${{ secrets.DROPLET_HOST }}/api/health/"
